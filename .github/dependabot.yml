version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/apps/backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'backend'
    groups:
      # Minor/patch se acumulan y se prueban juntas en una sola PR — solo un bump
      # de major (potencialmente breaking) sigue llegando aislado para revisarlo
      # con más cuidado, igual que se hizo a mano con eslint 10 este ciclo.
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/apps/frontend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'frontend'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
