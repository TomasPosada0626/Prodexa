name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Corre tambien de forma programada para detectar vulnerabilidades nuevas
    # en dependencias que ya estaban instaladas (no solo en cada push).
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Auditoria de dependencias (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Instalar dependencias
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: npm audit (falla en vulnerabilidades altas o criticas de produccion)
        working-directory: apps/${{ matrix.app }}
        # --omit=dev: las vulnerabilidades de devDependencies (eslint, jest, @nestjs/cli)
        # no llegan nunca al build de produccion ni se ejecutan con input de un atacante,
        # solo se invocan localmente/en CI con rutas de archivos del propio repo. Auditar
        # solo lo que se despliega evita bloquear el pipeline por herramientas de
        # desarrollo sin fix disponible (ver docs/security/owasp-top10.md).
        run: npm audit --audit-level=high --omit=dev
